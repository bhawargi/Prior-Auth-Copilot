<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prior-Auth Copilot</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #fff; --ink: #1b2330; --muted: #5b6676; --line: #dde1e7;
    --accent: #0f6e8c; --accent-soft: #e4f2f6;
    --human: #7a4fd0; --human-soft: #efe8fb;
    --warn: #c2410c; --warn-soft: #fdebe1;
    --ok: #15803d; --ok-soft: #e3f5e9;
    --err: #b91c1c; --err-soft: #fde8e8;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: var(--panel); border-bottom: 3px solid var(--accent); }
  header h1 { margin: 0; font-size: 19px; }
  header .sub { color: var(--muted); font-size: 13px; }
  .badge { margin-left: auto; font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; }
  .badge.mock { background: #eef0f3; color: var(--muted); }
  main { display: grid; grid-template-columns: 280px minmax(0, 1fr) 440px; gap: 14px; padding: 14px; height: calc(100vh - 58px); }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: auto; padding: 14px; }
  h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); margin: 0 0 10px; }
  h3 { font-size: 15px; margin: 0 0 4px; }
  button { font: inherit; cursor: pointer; border-radius: 7px; border: 1px solid var(--line); background: #fff; padding: 7px 12px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  button.approve { background: var(--ok); color: #fff; border-color: var(--ok); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  select, textarea { font: inherit; width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 7px; }
  textarea { min-height: 60px; resize: vertical; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .scenario { font-size: 12px; color: var(--muted); margin: 6px 0 10px; min-height: 32px; }
  .case { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
  .case.sel { border-color: var(--accent); background: var(--accent-soft); }
  .case b { display: block; }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: #eef0f3; color: var(--muted); }
  .pill.working { background: var(--accent-soft); color: var(--accent); }
  .pill.awaiting_review { background: var(--human-soft); color: var(--human); }
  .pill.waiting_on_payer { background: #fff4d6; color: #92600a; }
  .pill.closed, .pill.met, .pill.approved { background: var(--ok-soft); color: var(--ok); }
  .pill.error, .pill.denied, .pill.not_met { background: var(--err-soft); color: var(--err); }
  .pill.unclear { background: var(--warn-soft); color: var(--warn); }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; }
  /* timeline */
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { position: relative; padding: 0 0 12px 26px; }
  .tl li::before { content: ""; position: absolute; left: 7px; top: 18px; bottom: 0; width: 2px; background: var(--line); }
  .tl li:last-child::before { display: none; }
  .dot { position: absolute; left: 0; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-soft); border: 2px solid var(--accent); }
  .k-thought .dot { background: #fff; border-style: dashed; }
  .k-human .dot { background: var(--human-soft); border-color: var(--human); }
  .k-payer .dot { background: #fff4d6; border-color: #b7791f; }
  .k-error .dot { background: var(--err-soft); border-color: var(--err); }
  .k-done .dot { background: var(--ok); border-color: var(--ok); }
  .k-order .dot { background: var(--ink); border-color: var(--ink); }
  .tl .title { font-weight: 600; }
  .k-thought .title { font-weight: 400; font-style: italic; color: var(--muted); }
  .tl .tool { font-family: var(--mono); font-size: 11px; background: #eef0f3; padding: 1px 6px; border-radius: 4px; margin-right: 6px; color: var(--ink); font-style: normal; }
  .tl .detail { color: var(--muted); font-size: 13px; }
  .tl details { font-size: 12px; margin-top: 3px; }
  .tl details pre { background: #f7f8fa; border: 1px solid var(--line); border-radius: 6px; padding: 8px; overflow: auto; max-height: 260px; font-family: var(--mono); font-size: 11px; white-space: pre-wrap; }
  .tl .time { font-size: 11px; color: var(--muted); margin-left: 6px; font-weight: 400; font-style: normal; }
  .working-note { color: var(--accent); font-size: 13px; padding-left: 26px; }
  .working-note::after { content: "…"; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  /* action panel */
  .box { border: 1px solid var(--line); border-radius: 9px; padding: 12px; margin-bottom: 12px; }
  .box.review { border-color: var(--human); background: #fcfaff; }
  .box.ok { border-color: var(--ok); background: #f6fcf8; }
  .box.bad { border-color: var(--err); background: #fffafa; }
  .crit { border-top: 1px solid var(--line); padding: 8px 0; }
  .crit:first-of-type { border-top: 0; }
  .crit .head { display: flex; gap: 8px; align-items: baseline; }
  .crit .cid { font-family: var(--mono); font-size: 12px; font-weight: 700; }
  .crit .text { font-size: 13px; flex: 1; }
  blockquote { margin: 6px 0 0; padding: 5px 9px; border-left: 3px solid var(--accent); background: var(--accent-soft); font-size: 13px; border-radius: 0 6px 6px 0; }
  blockquote cite { display: block; font-style: normal; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .letter { white-space: pre-wrap; font-size: 12.5px; background: #f7f8fa; border: 1px solid var(--line); border-radius: 6px; padding: 10px; max-height: 240px; overflow: auto; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .flash { color: var(--err); font-size: 13px; margin-top: 6px; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; height: auto; } .col { max-height: none; } }
</style>
</head>
<body>
<header>
  <h1>Prior-Auth Copilot</h1>
  <span class="sub">Agentic prior authorization · synthetic data only</span>
  <span class="badge" id="mode">…</span>
</header>
<main>
  <section class="col">
    <h2>New order</h2>
    <select id="patient"></select>
    <div class="scenario" id="scenario"></div>
    <button class="primary" id="start" style="width:100%">Start agent on this order</button>
    <h2 style="margin-top:22px">Cases</h2>
    <div id="cases"><div class="muted small">No cases yet.</div></div>
  </section>

  <section class="col">
    <h2>Case</h2>
    <div id="panel"><div class="empty">No case selected.</div></div>
  </section>

  <section class="col">
    <h2>Agent activity</h2>
    <div id="timeline"><div class="empty">Start a case to watch the agent plan, act and adapt.</div></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const STATUS = { working: "Agent working", awaiting_review: "Needs clinician review", waiting_on_payer: "Waiting on payer", closed: "Closed", error: "Error" };
let patients = [], selected = null, lastRender = "", timer = null;

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || res.statusText);
  return json;
}

async function init() {
  const meta = await api("/api/meta");
  const badge = $("#mode");
  badge.textContent = meta.mode === "watsonx" ? `IBM watsonx.ai · ${meta.model}` : "Mock agent (offline)";
  if (meta.mode !== "watsonx") badge.classList.add("mock");
  patients = await api("/api/patients");
  $("#patient").innerHTML = patients.map((p) => `<option value="${p.id}">${esc(p.name)}: ${esc(p.order)} (${esc(p.payer)})</option>`).join("");
  $("#patient").onchange = showScenario;
  showScenario();
  $("#start").onclick = async () => {
    $("#start").disabled = true;
    try { const { id } = await api("/api/cases", { patient_id: $("#patient").value }); selected = id; await refresh(); }
    finally { $("#start").disabled = false; }
  };
  await refresh();
  timer = setInterval(refresh, 1000);
}

function showScenario() {
  const p = patients.find((x) => x.id === $("#patient").value);
  $("#scenario").textContent = p ? `CPT ${p.cpt}. Demo scenario: ${p.scenario}` : "";
}

async function refresh() {
  const cases = await api("/api/cases");
  $("#cases").innerHTML = cases.length ? cases.map((c) => `
    <div class="case ${c.id === selected ? "sel" : ""}" data-id="${c.id}">
      <b>${esc(c.patient_name)}</b>
      <div class="small muted">${esc(c.order)} · ${esc(c.payer)}</div>
      <span class="pill ${c.status}">${STATUS[c.status] || c.status}</span>
    </div>`).join("") : `<div class="muted small">No cases yet.</div>`;
  document.querySelectorAll(".case").forEach((el) => el.onclick = () => { selected = el.dataset.id; lastRender = ""; refresh(); });
  if (!selected) return;
  const c = await api(`/api/cases/${selected}`);
  const key = JSON.stringify([c.updated_at, c.status, c.timeline.length]);
  if (key === lastRender) return;
  lastRender = key;
  renderTimeline(c);
  renderPanel(c);
}

function renderTimeline(c) {
  const tl = $("#timeline");
  const atBottom = tl.parentElement.scrollHeight - tl.parentElement.scrollTop - tl.parentElement.clientHeight < 60;
  const items = c.timeline.map((e) => {
    const tool = e.data?.tool ? `<span class="tool">${esc(e.data.tool)}</span>` : "";
    const raw = e.data ? `<details><summary>Arguments and result</summary><pre>${esc(JSON.stringify({ args: e.data.args, result: e.data.result }, null, 2))}</pre></details>` : "";
    return `<li class="k-${e.kind}"><span class="dot"></span>
      <div class="title">${tool}${esc(e.title)}<span class="time">${esc(e.ts.slice(11))}</span></div>
      ${e.detail ? `<div class="detail">${esc(e.detail)}</div>` : ""}${raw}</li>`;
  }).join("");
  tl.innerHTML = `<ul class="tl">${items}</ul>${c.status === "working" ? `<div class="working-note">Agent is working</div>` : ""}`;
  if (atBottom || c.status === "working") tl.parentElement.scrollTop = tl.parentElement.scrollHeight;
}

function renderPanel(c) {
  const sub = c.submissions.at(-1);
  let html = `<div class="box">
    <h3>${esc(c.patient_name)}</h3>
    <div class="kv">
      <span>Order</span><span>${esc(c.order.description)} (CPT ${esc(c.order.cpt)})</span>
      <span>Diagnosis</span><span>${esc(c.order.diagnosis)}</span>
      <span>Payer</span><span>${esc(c.payer_name)}${c.policy_id ? ` · ${esc(c.policy_id)}` : ""}</span>
      <span>Status</span><span><span class="pill ${c.status}">${STATUS[c.status] || c.status}</span></span>
      ${c.submissions.map((s) => `<span>${s.kind === "appeal" ? "Appeal" : "Request"}</span><span>${esc(s.id)} <span class="pill ${s.status}">${s.status}</span></span>`).join("")}
    </div></div>`;

  if (c.status === "error") html += `<div class="box bad"><b>Agent error</b><div class="small">${esc(c.error)}</div></div>`;

  if (c.status === "closed" && c.outcome) {
    const good = ["approved", "not_required"].includes(c.outcome.outcome);
    html += `<div class="box ${good ? "ok" : "bad"}"><b>${esc(c.outcome.outcome.replace("_", " ").toUpperCase())}</b><div>${esc(c.outcome.summary)}</div></div>`;
  }

  if (c.status === "waiting_on_payer") {
    html += `<div class="box"><b>Waiting on ${esc(c.payer_name)}</b>
      <div class="small muted">In real life this takes days. The agent remembers the case and resumes when the payer responds.</div>
      <div class="row"><button class="primary" id="payer">Simulate payer response</button>
      <label class="small"><input type="checkbox" id="force"> Force a denial (demo)</label></div>
      <div class="flash" id="flash"></div></div>`;
  }

  if (c.packet) {
    const p = c.packet, review = c.status === "awaiting_review";
    const denial = p.kind === "appeal" && sub?.result?.reason ? `<div class="box bad small"><b>Denial being appealed:</b> ${esc(sub.result.denial_code)}: ${esc(sub.result.reason)}</div>` : "";
    html += `${denial}<div class="box ${review ? "review" : ""}">
      <h3>${p.kind === "appeal" ? "Appeal" : "Prior-auth request"} packet v${p.version}</h3>
      <div class="small muted" style="margin-bottom:6px">${review ? "Review the evidence the agent found. Nothing is sent to the payer until you approve." : p.submitted ? "Submitted to payer." : "Approved."}</div>
      ${p.criteria.map((cr) => `<div class="crit">
        <div class="head"><span class="cid">${esc(cr.criterion_id)}</span><span class="text">${esc(cr.criterion)}</span><span class="pill ${cr.status}">${esc(cr.status.replace("_", " "))}</span></div>
        ${cr.evidence.map((e) => `<blockquote>"${esc(e.quote)}"<cite>${esc(e.doc_id)} · ${esc(e.title)} · ${esc(e.date)}</cite></blockquote>`).join("")}
        ${cr.note ? `<div class="small" style="color:var(--warn)">${esc(cr.note)}</div>` : ""}
      </div>`).join("")}
      <h2 style="margin-top:10px">${p.kind === "appeal" ? "Appeal letter" : "Letter of medical necessity"}</h2>
      <div class="letter">${esc(p.letter)}</div>
      ${review ? `<div class="row"><button class="approve" id="approve">Approve &amp; submit</button></div>
        <textarea id="note" placeholder="Optional for approval. Required to send back: tell the agent what to fix." style="margin-top:8px"></textarea>
        <div class="row"><button id="return">Send back to agent</button></div>
        <div class="flash" id="flash"></div>` : ""}
    </div>`;
  }

  $("#panel").innerHTML = html;
  const act = (fn) => async () => {
    document.querySelectorAll("#panel button").forEach((b) => b.disabled = true);
    try { await fn(); lastRender = ""; await refresh(); }
    catch (e) { $("#flash").textContent = e.message; document.querySelectorAll("#panel button").forEach((b) => b.disabled = false); }
  };
  if ($("#approve")) $("#approve").onclick = act(() => api(`/api/cases/${c.id}/review`, { decision: "approve", note: $("#note").value }));
  if ($("#return")) $("#return").onclick = act(() => api(`/api/cases/${c.id}/review`, { decision: "return", note: $("#note").value }));
  if ($("#payer")) $("#payer").onclick = act(() => api(`/api/cases/${c.id}/payer-respond`, { force_denial: $("#force").checked }));
}

init();
</script>
</body>
</html>
